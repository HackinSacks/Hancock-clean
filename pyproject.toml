[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hancock"
version = "1.0.0"
description = "CyberViser Hancock — lean AI cybersecurity co-pilot (FastAPI + Ollama/NVIDIA/OpenAI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Johnny Watters (0ai-Cyberviser)" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.0",
  "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
train = [
  "torch>=2.4.0",
  "transformers>=4.50.0",
  "datasets>=2.20.0",
  "peft>=0.14.0",
  "trl>=0.24.0",
  "accelerate>=1.0.0",
  "bitsandbytes>=0.48.0",
  "sentencepiece>=0.2.0",
]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "httpx>=0.27.0"]

[project.scripts]
hancock = "hancock.cli:main"

[tool.setuptools.packages.find]
include = ["hancock*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
